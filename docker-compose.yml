name: clarifiapp

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: clarifi_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ${PWD:-.}:/var/www
        ports:
            - "8000:8000"
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-clarifi_db}
            DB_USERNAME: ${DB_USERNAME:-clarifi_user}
            DB_PASSWORD: ${DB_PASSWORD:-clarifi_secret}
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: postgres:16-alpine
        container_name: clarifi_pgsql
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-clarifi_db}
            POSTGRES_USER: ${DB_USERNAME:-clarifi_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-clarifi_secret}
        ports:
            - "5432:5432"
        volumes:
            - clarifi_pgsql_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    vite:
        image: node:20-alpine
        container_name: clarifi_vite
        working_dir: /var/www
        volumes:
            - ${PWD:-.}:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host"

volumes:
    clarifi_pgsql_data:
