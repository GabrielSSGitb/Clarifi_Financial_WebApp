name: CI

on:
    push:
        branches: [main, master, develop]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: "8.4"
    NODE_VERSION: "24"

jobs:
    # -----------------------------------------------------------
    # Estilo de codigo (Laravel Pint)
    # -----------------------------------------------------------
    code-style:
        name: Estilo de codigo
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Instalar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none

            - name: Instalar dependencias
              uses: ramsey/composer-install@v3

            - name: Verificar formatacao
              run: vendor/bin/pint --test

    # -----------------------------------------------------------
    # Testes automatizados (PHPUnit sobre Postgres)
    # -----------------------------------------------------------
    tests:
        name: Testes (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ["8.4"]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: clarifi_user
                    POSTGRES_PASSWORD: clarifi_secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U clarifi_user -d testing"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: testing
            DB_USERNAME: clarifi_user
            DB_PASSWORD: clarifi_secret

        steps:
            - uses: actions/checkout@v4

            - name: Instalar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_pgsql, zip, intl, gd, bcmath
                  coverage: none

            - name: Instalar dependencias
              uses: ramsey/composer-install@v3

            - name: Preparar ambiente
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Aplicar migrations
              run: php artisan migrate --force

            - name: Rodar testes
              run: php artisan test

    # -----------------------------------------------------------
    # Build dos ativos de frontend
    # -----------------------------------------------------------
    frontend:
        name: Build de frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Instalar Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Instalar dependencias
              run: npm ci --no-audit --no-fund

            - name: Compilar assets
              run: npm run build

            - name: Publicar artefato
              uses: actions/upload-artifact@v4
              with:
                  name: assets
                  path: public/build
                  retention-days: 7

    # -----------------------------------------------------------
    # Imagem Docker: sempre construida, publicada no GHCR apenas
    # em main/master e em tags v*
    # -----------------------------------------------------------
    image:
        name: Imagem Docker
        runs-on: ubuntu-latest
        needs: [code-style, tests, frontend]

        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Configurar Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar no GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Calcular tags e labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Construir (e publicar) a imagem de producao
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: production
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
